spring:
  application:
    name: study-project
  data:
    mongodb:
      uri: ${DB_URI}
server:
  port: 8080
api:
  key: ${API_KEY}
tweet-import:
  file-paths: classpath:data/realDonaldTrump_in_office.csv,classpath:data/realDonaldTrump_bf_office.csv
  batch-size: 1000
  remove-hashtag: true
  remove-mention: true
  remove-emoji: true
rag:
  azure-openai:
    api-key: ${AZURE_OPENAI_API_KEY}
    endpoint: ${AZURE_OPENAI_ENDPOINT}
    api-version: ${AZURE_OPENAI_API_VERSION:2024-12-01-preview}
    embedding-deployment: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:text-embedding-ada-002}
    chat-deployment: ${AZURE_OPENAI_CHAT_DEPLOYMENT:gpt-4o}
    max-tokens: 1200
    temperature: 0.7
    top-k: 7
    chunk-size: 400
    chunk-overlap: 50

logging:
  level:
    mago.study.domain.rag: DEBUG
    root: INFO