plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'mago'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	
	// RAG 관련 의존성 (LangChain4j 사용)
	implementation 'dev.langchain4j:langchain4j:0.34.0'
	implementation 'dev.langchain4j:langchain4j-open-ai:0.34.0'
	implementation 'dev.langchain4j:langchain4j-embeddings:0.34.0'
	implementation 'dev.langchain4j:langchain4j-azure-open-ai:0.34.0'
	
	// JSON 처리
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	
	// Apache Commons (CSV, Text 처리)
	implementation 'org.apache.commons:commons-csv:1.10.0'
	implementation 'org.apache.commons:commons-text:1.11.0'
	
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
